# Pipeline minimo (D3 - Primeira Maneira: fluxo automatizado com feedback rapido)
# 1) testes (unitarios, integracao simulada e contrato)  2) build da imagem + smoke test
# 3) na main: publica a imagem no GitHub Container Registry (artefato que o compose da API
#    principal consome: ghcr.io/fseb-sw/feriasflow-calendario-api)
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  IMAGEM: ghcr.io/fseb-sw/feriasflow-calendario-api

jobs:
  testes:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  imagem:
    name: Imagem Docker + smoke test
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t feriasflow-calendario-api:ci .
      - name: Sobe o container e confere o /health
        run: |
          docker run -d --name api -p 8000:8000 feriasflow-calendario-api:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

  publicar:
    name: Publicar imagem no GHCR (main)
    needs: imagem
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push (latest + sha)
        run: |
          docker build -t "$IMAGEM:latest" -t "$IMAGEM:${GITHUB_SHA::7}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" .
          docker push "$IMAGEM:latest"
          docker push "$IMAGEM:${GITHUB_SHA::7}"
